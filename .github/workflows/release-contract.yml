name: Release contract

on:
  push:
    tags:
      - 'v*'
      - 'release'

permissions:
  contents: read

jobs:
  validate-release-metadata:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -ceq 'release') {
            .\scripts\validate-rolling-release-metadata.ps1 -TagName $env:RELEASE_TAG
          } else {
            .\scripts\validate-release-metadata.ps1 -TagName $env:RELEASE_TAG
          }
